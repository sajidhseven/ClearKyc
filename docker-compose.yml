services:
  postgres:
    image: postgres:16-alpine
    container_name: kyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kycpass
      POSTGRES_DB: kycdb
    ports: ["5432:5432"]
    volumes: ["kyc_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kycdb"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kyc_pgdata:
